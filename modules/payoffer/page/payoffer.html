<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>收益结构 | OptionHelper</title>
    <link rel="icon" href="../../icons/optionhelper-app-icon-tile-light.svg">
    <link rel="stylesheet" href="./ui/style.css">
    <link rel="stylesheet" href="./ui/controls.css">
    <link rel="stylesheet" href="../module-host-presentation.css">
    <style>
      .runtime-parameter-grid { grid-template-columns: 1fr; }
      .runtime-parameter-grid .parameter-field,
      .runtime-parameter-grid .parameter-field.full { grid-template-columns: minmax(0, 1fr); }
      .runtime-parameter-grid .parameter-field select { width:100%; height:29px; padding:0 5px; border:1px solid var(--rule); background:var(--color-surface); color:var(--ink); font:11px var(--font); }
      .runtime-parameter-grid .parameter-field textarea { width:100%; min-height:58px; padding:6px; border:1px solid var(--rule); background:var(--color-surface); color:var(--ink); font:10px/1.45 var(--mono); resize:vertical; }
      .runtime-parameter-grid .parameter-field small { grid-column: 1 / -1; color:var(--muted); font:9px/1.4 var(--mono); overflow-wrap:anywhere; }
      .runtime-parameter-grid .parameter-field span { min-width:0; overflow-wrap:anywhere; }
      .runtime-parameter-grid .term-control-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:7px; }
      .runtime-parameter-grid .term-control-row > :is(input,select,textarea) { min-width:0; }
      .runtime-parameter-grid .term-control-row > textarea { grid-column:1 / -1; }
      .runtime-parameter-grid .parameter-unit { color:var(--muted); font:10px/1.35 var(--font); font-style:normal; white-space:nowrap; }
      .runtime-parameter-grid .term-tenor { display:grid; grid-template-columns:minmax(0,1fr) 76px; gap:7px; }
      .runtime-parameter-grid .term-tenor > :is(input,select) { min-width:0; }
      .runtime-parameter-grid input[type="number"] { appearance:textfield; -moz-appearance:textfield; }
      .runtime-parameter-grid input[type="number"]::-webkit-inner-spin-button,
      .runtime-parameter-grid input[type="number"]::-webkit-outer-spin-button { margin:0; -webkit-appearance:none; }
      .runtime-parameter-grid .term-input:disabled,.runtime-parameter-grid .term-input[aria-disabled="true"] { background:var(--wash); color:var(--muted); }
      .runtime-parameter-grid .term-input:disabled { cursor:not-allowed; }
      .runtime-parameter-grid .term-input[aria-disabled="true"] { cursor: default; }
      .runtime-actions { display:grid; gap:7px; margin-top:10px; }
      .runtime-actions .button { width:100%; }
      .scenario-list li { cursor: default; }
      .scenario-kind { display:block; margin-top:3px; color:var(--muted); font:10px var(--mono); }
      .canvas-viewport .canvas-stage > svg { display:block; width:100%; height:100%; }
      .canvas-size-grid { grid-template-columns:1fr; }
      .canvas-size-grid .parameter-field { grid-template-columns:minmax(0,.9fr) minmax(112px,1.1fr); }
      .canvas-size-note { margin:8px 0 0; color:var(--muted); font-size:10px; line-height:1.5; }
      .source-detail .formula { display:block; margin-top:5px; white-space:normal; overflow-wrap:anywhere; }
      .canvas-toolbar-primary { display:flex; min-width:0; align-items:center; gap:12px; }
      .canvas-panel { grid-template-rows:minmax(50px, auto) auto minmax(0, 1fr); }
      .canvas-panel > .notice-area { grid-row:2; }
      .canvas-panel > .canvas-viewport { grid-row:3; }
      .canvas-toolbar { flex-wrap:wrap; gap:8px; padding:10px 16px; }
      .canvas-toolbar-actions { flex-wrap:wrap; }
      .payoff-viewer { position:fixed; inset:0; width:calc(100vw - 24px); max-width:calc(100vw - 24px); height:calc(100vh - 24px); height:calc(100dvh - 24px); max-height:calc(100dvh - 24px); margin:auto; padding:0; overflow:hidden; border:1px solid var(--rule); border-radius:12px; background:var(--color-surface); color:var(--ink); }
      .payoff-viewer[open] { display:grid; grid-template-rows:auto minmax(0, 1fr); }
      .payoff-viewer::backdrop { background:rgba(37,37,37,.36); }
      .payoff-viewer-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--rule); }
      .payoff-viewer-title { margin:0 auto 0 0; font-size:14px; font-weight:650; }
      .payoff-viewer-actions { display:flex; flex-wrap:wrap; gap:8px; }
      .payoff-viewer-actions .button { min-height:36px; }
      .payoff-viewer-actions .button[aria-pressed="true"] { background:var(--color-blue-gray-soft); color:var(--ink); border-color:var(--color-blue-gray); }
      .payoff-viewer-viewport { min-width:0; min-height:0; overflow:auto; overscroll-behavior:contain; padding:16px; background:var(--color-blue-gray-soft); }
      .payoff-viewer-stage { margin:0 auto; }
      .payoff-viewer-stage > svg { display:block; width:100%; height:100%; max-width:none; }
      .payoff-viewer :focus-visible { outline:2px solid var(--color-blue-gray); outline-offset:2px; }
      .payoff-viewer-viewport:focus-visible { outline-offset:-3px; }
      @media (pointer:coarse) { .payoff-viewer-actions .button { min-height:44px; } }
      .scope-notice { min-width:0; color:var(--muted); font-size:11px; }
      [hidden] { display:none !important; }
    </style>
    <style>
      .readonly .canvas-viewport { padding: 24px; background: var(--color-blue-gray-soft); }
      .readonly .canvas-stage,
      .readonly .canvas-viewport > svg,
      .readonly .canvas-viewport > img { border: 1px solid var(--color-rule); box-shadow: none; }
      .readonly .runtime-parameter-grid .parameter-field select,
      .readonly .runtime-parameter-grid .parameter-field textarea,
      .readonly .runtime-actions .button { border-radius: 8px; }
      .readonly .lock-card { border-top: 1px solid var(--color-rule); }
    </style>
  </head>
  <body>
    <div class="app-shell editing" id="appShell">
      <header class="topbar">
        <div class="brand"><img class="brand-logo" src="../../icons/optionhelper-logo.svg" alt="OptionHelper"><span class="brand-separator" aria-hidden="true"></span><span class="module-title">收益结构</span></div>
        <div class="scope-notice" id="scopeNotice">开发预览</div>
        <div class="topbar-status" id="modeBadge">正在连接运行服务</div>
        <div class="topbar-actions"><button class="button button-quiet" id="recheckButton">重新读取资料库</button></div>
      </header>

      <main class="workbench" id="workbench">
        <aside class="library-panel">
          <h1>产品结构</h1>
          <label class="field-label" for="productSelect">产品</label>
          <select id="productSelect" class="product-select"><option value="">请选择产品</option></select>
          <div class="binding-card" id="bindingCard"><span>尚未选择产品</span></div>
          <div class="scenario-heading"><span>产品路径</span><small id="scenarioCount">0</small></div>
          <ol class="scenario-list" id="scenarioList"></ol>
        </aside>
        <div class="panel-resizer panel-resizer-left" id="libraryResizer" role="separator" aria-label="调整产品结构面板宽度" aria-orientation="vertical" tabindex="0"></div>

        <section class="canvas-panel">
          <div class="canvas-toolbar">
            <div class="canvas-toolbar-primary">
              <div class="canvas-state"><span class="state-dot" id="stateDot"></span><span id="canvasState">等待运行</span></div>
            </div>
            <div class="canvas-toolbar-actions">
              <div class="zoom-control" aria-label="画布缩放" aria-hidden="true" hidden><button class="zoom-button" id="zoomOutButton" title="缩小">−</button><label class="zoom-input-wrap"><input id="zoomInput" type="number" min="10" max="200" step="1" inputmode="numeric" aria-label="画布缩放百分比" value="100"><em>%</em></label><button class="zoom-button" id="zoomInButton" title="放大">+</button><button class="zoom-fit" id="zoomFitButton" title="适应画布">适应</button></div>
              <button class="button button-quiet" id="canvasDefaultButton" disabled>查看默认图</button>
              <button class="button button-quiet" id="canvasExpandButton" aria-haspopup="dialog" aria-controls="payoffViewerDialog" disabled>放大查看</button>
              <button class="button button-quiet" id="canvasPreviewButton" disabled>预览</button>
              <button class="button button-primary" id="canvasSaveButton" disabled>保存</button>
            </div>
          </div>
          <div class="notice-area" id="noticeArea" aria-live="polite" aria-atomic="true"></div>
          <div class="canvas-viewport" id="canvasViewport">
            <div class="empty-canvas" id="emptyCanvas"><p>请从左侧选择一个产品。</p></div>
          </div>
        </section>
        <div class="panel-resizer panel-resizer-right" id="inspectorResizer" role="separator" aria-label="调整条款参数面板宽度" aria-orientation="vertical" tabindex="0"></div>

        <aside class="inspector-panel" id="inspectorPanel">
          <h2 id="inspectorTitle">合同条款</h2>
          <section class="inspector-group module-parameter-section">
            <div class="parameter-grid runtime-parameter-grid" id="parameterFields"></div>
            <div class="semantic-rules" id="semanticRules" aria-label="固定观察规则" hidden></div>
            <div class="runtime-actions" hidden><button class="button button-quiet small" id="applyParametersButton" hidden>解析并更新收益图</button><button class="button button-quiet small" id="restoreDefaultsButton" hidden>恢复默认值</button></div>
          </section>
          <details class="module-advanced" id="canvasSizeGroup" hidden>
            <summary>图形导出</summary>
            <div class="module-advanced-panel">
              <div class="parameter-grid canvas-size-grid">
                <label class="parameter-field"><span>图片宽度</span><input id="canvasWidth" type="number" min="240" max="6000" step="1" inputmode="numeric" value="1200"><em>px</em></label>
                <label class="parameter-field"><span>图片高度</span><input id="canvasHeight" type="number" min="180" max="6000" step="1" inputmode="numeric" placeholder="载入后显示"><em>px</em></label>
              </div>
            </div>
          </details>
          <details class="module-advanced" id="pathExplanationGroup">
            <summary>路径说明</summary>
            <div class="module-advanced-panel">
              <div class="source-detail" id="sourceDetail">选择路径查看条件与收益。</div>
              <div class="source-detail" id="selectedPathDetail"></div>
            </div>
          </details>
          <details class="module-advanced" id="maintenancePanel" hidden>
            <summary>默认图维护</summary>
            <div class="module-advanced-panel">
              <p class="hint">仅限本机显式管理员维护进程。先生成只读计划，再输入二次确认文字后发布。</p>
              <label class="parameter-field full"><span>确认原因</span><textarea id="maintenanceReason" spellcheck="false"></textarea></label>
              <div class="runtime-actions"><button class="button button-quiet small" id="maintenancePlanButton">生成维护计划</button></div>
              <div id="maintenancePlanDetail" class="source-detail">尚未生成维护计划。</div>
              <label class="parameter-field full"><span>二次确认</span><input id="maintenanceConfirmation" autocomplete="off" spellcheck="false" disabled></label>
              <div class="runtime-actions"><button class="button button-primary small" id="maintenancePublishButton" disabled>发布默认图</button></div>
            </div>
          </details>
        </aside>
      </main>
    </div>

    <dialog class="payoff-viewer" id="payoffViewerDialog" aria-labelledby="payoffViewerTitle">
      <div class="payoff-viewer-toolbar">
        <h2 class="payoff-viewer-title" id="payoffViewerTitle">收益图</h2>
        <div class="payoff-viewer-actions">
          <button class="button button-quiet" id="payoffViewerFitButton" aria-pressed="true">适合窗口</button>
          <button class="button button-quiet" id="payoffViewerActualButton" aria-pressed="false">原始尺寸</button>
          <button class="button button-quiet" id="payoffViewerCloseButton" autofocus>关闭</button>
        </div>
      </div>
      <div class="payoff-viewer-viewport" id="payoffViewerViewport" tabindex="0" aria-label="收益图，可滚动查看">
        <div class="payoff-viewer-stage" id="payoffViewerStage"></div>
      </div>
    </dialog>

    <script src="../module-host-presentation.js"></script>
    <script src="../module-host-bridge.js"></script>
    <script>
      const $ = id => document.getElementById(id);
      const state = {
        products: [], product: null, preview: null, defaultExample: null, previewPayload: null, previewSignature: null,
        selectedPathIndex: 0, zoom: 1, zoomMode: 'fit', canvasRequestId: 0, inputsDirty: false, saving: false, saveRequestId: 0,
        maintenanceEnabled: false, maintenancePlan: null, maintenanceRequestId: 0, catalogRequestId: 0,
        moduleVisible: document.documentElement?.dataset?.optionhelperModuleActive !== 'false', resetOnActivation: false, moduleResetLoading: false, hasSavedResult: false
      };
      let canvasPan = null;
      const query = new URLSearchParams(location.search);
      const hostedInDesk = query.get('host') === 'optdesk' && window.parent !== window;
      const localDevelopmentPreview = !hostedInDesk && query.get('mode') === 'local-development-preview';
      const apiBase = location.protocol === 'file:' ? 'http://127.0.0.1:4181' : '';
      const apiUrl = path => apiBase + path;
      const selectValues = {
        exercise_style: [['European', '仅到期日可行权'], ['American', '存续期内可行权'], ['Bermudan', '约定观察日可行权']],
        settlement: [['cash', '现金结算']]
      };
      const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
      const mathHtml = value => window.OptionHelperModulePresentation?.formatMath(value) || escapeHtml(value);
      const safeSvgElement = source => {
        const documentNode = new DOMParser().parseFromString(String(source ?? ''), 'image/svg+xml');
        const svg = documentNode.documentElement;
        if (svg.localName !== 'svg' || documentNode.querySelector('parsererror')) throw new Error('收益图格式无效。');
        svg.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(node => node.remove());
        svg.querySelectorAll('*').forEach(node => {
          [...node.attributes].forEach(attribute => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim().toLowerCase();
            if (name.startsWith('on') || ((name === 'href' || name.endsWith(':href')) && value.startsWith('javascript:'))) node.removeAttribute(attribute.name);
          });
        });
        return document.importNode(svg, true);
      };
      const termInputs = () => [...document.querySelectorAll('.term-input')];
      const productSelectionKey = `optionhelper:payoffer:product:${query.get('bridge_nonce') || 'standalone'}`;
      const savedProductId = () => { try { return sessionStorage.getItem(productSelectionKey) || ''; } catch (_error) { return ''; } };
      const rememberProductId = value => { try { if (value) sessionStorage.setItem(productSelectionKey, value); else sessionStorage.removeItem(productSelectionKey); } catch (_error) { /* Session storage may be unavailable in hardened webviews. */ } };
      const runtimeSuccessNotice = () => hostedInDesk
        ? '结果已保存，可继续生成报告或报价。'
        : '预览已保存。';

      function showNotice(message, type = '') {
        if (hostedInDesk && !type && (message === runtimeSuccessNotice()
          || /^已按当前输入计算\d+条收益路径。$/.test(message)
          || ['已载入正式默认图。', '已载入只读默认图。', '默认图维护已完成。', '已恢复默认参数。', '产品目录已重新读取。'].includes(message))) {
          $('noticeArea').replaceChildren();
          return;
        }
        $('noticeArea').innerHTML = '<div class="notice ' + type + '"><strong>' + (type === 'error' ? '无法执行' : '收益结构') + '</strong><span>' + escapeHtml(message) + '</span></div>';
      }

      function setServiceStatus(message, error = false) {
        $('modeBadge').textContent = message;
        $('modeBadge').style.color = error ? 'var(--color-brand-red)' : '';
      }

      function setCanvasState(message, mode = 'ready') {
        $('canvasState').textContent = message;
        const dot = mode === 'ready' ? 'valid' : mode === 'busy' ? 'edit' : mode === 'dirty' ? 'dirty' : '';
        $('stateDot').className = 'state-dot ' + dot;
      }

      function canRuntimePreview() {
        if (state.product?.runtime_status !== 'enabled') return false;
        if (hostedInDesk) return true;
        return localDevelopmentPreview;
      }

      function setRuntimeInputsLocked(locked) {
        const enabled = canRuntimePreview() && !locked;
        $('productSelect').disabled = locked;
        $('recheckButton').disabled = locked;
        termInputs().forEach(input => { input.disabled = !enabled; });
        $('applyParametersButton').disabled = !enabled;
        $('restoreDefaultsButton').disabled = !enabled;
        $('canvasPreviewButton').disabled = !enabled;
        $('canvasSaveButton').disabled = !enabled || Boolean(state.previewFailed);
        $('canvasDefaultButton').disabled = locked || !state.product;
        $('canvasWidth').disabled = locked || !hostedInDesk || !state.product;
        $('canvasHeight').disabled = locked || !hostedInDesk || !state.product;
      }

      function runtimeAvailabilityMessage() {
        if (hostedInDesk) return '合同条款可编辑。';
        if (localDevelopmentPreview) return '开发预览。';
        return '默认图只读。';
      }

      function updateRuntimeChrome({ preserve = false } = {}) {
        const editable = canRuntimePreview();
        $('appShell').classList.toggle('editing', editable);
        $('appShell').classList.toggle('readonly', !editable);
        $('pathExplanationGroup').hidden = !editable;
        $('canvasSizeGroup').hidden = !hostedInDesk;
        $('canvasWidth').disabled = !hostedInDesk || !state.product;
        $('canvasHeight').disabled = !hostedInDesk || !state.product;
        $('maintenancePanel').hidden = !(localDevelopmentPreview && state.maintenanceEnabled && !hostedInDesk);
        $('scopeNotice').textContent = hostedInDesk
          ? '正式运行'
          : (localDevelopmentPreview ? '开发预览' : '只读');
        renderParameters({ preserve });
      }

      function defaultValue(field) {
        return field.default_value;
      }

      function displayValue(value, field = null) {
        if (field?.value_encoding === 'percentage_input_decimal_internal' && Number.isFinite(Number(value))) {
          // 按十进制移位，避免二进制乘法尾差，也不截断合法小数精度。
          const [coefficient, exponent = '0'] = String(Number(value)).split('e');
          return String(Number(`${coefficient}e${Number(exponent) + 2}`));
        }
        return value !== null && typeof value === 'object' ? JSON.stringify(value) : String(value ?? '');
      }

      function fieldForKey(key) {
        return (state.product?.payoff_fields || []).find(field => field.key === key) || null;
      }

      function displayUnit(field) {
        if (field?.key === 'T') return '年';
        return String(field?.display_unit || '');
      }

      function inputKind(field) {
        if (Array.isArray(field.default_value) || (field.default_value && typeof field.default_value === 'object')) return 'json';
        if (typeof field.default_value === 'number') return 'number';
        if (typeof field.default_value === 'boolean') return 'boolean';
        return 'text';
      }

      function selectControl(field, value, attributes) {
        const options = Array.isArray(field.domain?.enum)
          ? field.domain.enum.map(option => [String(option), window.OptionHelperModulePresentation?.termValueLabel?.(option) || String(option)])
          : field.key === 'observation_price'
          ? (state.product?.observation_price_options || []).map(option => [option.value, option.label])
          : selectValues[field.key];
        if (!options) return '';
        return '<select' + attributes + '>' + options.map(option => '<option value="' + escapeHtml(option[0]) + '"' + (String(value) === option[0] ? ' selected' : '') + '>' + escapeHtml(option[1]) + '</option>').join('') + '</select>';
      }

      function termControl(field) {
        const value = displayValue(defaultValue(field), field);
        const kind = inputKind(field);
        const attributes = ' class="term-input" data-key="' + escapeHtml(field.key) + '" data-kind="' + kind + '" data-encoding="' + escapeHtml(field.value_encoding || 'native') + '" data-default="' + escapeHtml(JSON.stringify(defaultValue(field))) + '"';
        if (field.key === 'T') {
          return '<span class="term-tenor"><input' + attributes + ' type="number" min="0" step="any" value="' + escapeHtml(value) + '"><select class="term-tenor-unit" aria-label="合同期限单位"><option value="year">年</option><option value="month">月</option><option value="day">自然日</option></select></span>';
        }
        const selector = selectControl(field, value, attributes);
        const control = selector || (kind === 'json'
          ? '<textarea' + attributes + '>' + escapeHtml(value) + '</textarea>'
          : kind === 'boolean'
            ? '<select' + attributes + '><option value="true"' + (value === 'true' ? ' selected' : '') + '>是</option><option value="false"' + (value === 'false' ? ' selected' : '') + '>否</option></select>'
            : '<input' + attributes + ' type="' + (kind === 'number' ? 'number' : 'text') + '"' + (kind === 'number' ? ' step="any"' : '') + ' value="' + escapeHtml(value) + '">');
        const unit = displayUnit(field);
        return '<span class="term-control-row">' + control + (unit ? '<em class="parameter-unit">' + escapeHtml(unit) + '</em>' : '') + '</span>';
      }

      function termField(field) {
        const full = field.key.length > 11 || typeof field.default_value === 'object';
        const symbol = field.math_symbol && field.math_symbol !== field.key
          ? ' <span class="field-symbol">' + mathHtml(field.math_symbol) + '</span>'
          : '';
        const label = escapeHtml(field.chinese_name) + symbol;
        const tenorNote = field.key === 'T'
          ? '<small>最终按ACT/365年数提交。' + ((state.product?.payoff_fields || []).some(item => item.key === 'n_obs') ? '观察日数独立控制回放终点。' : '') + '</small>'
          : '';
        return '<label class="parameter-field ' + (full ? 'full' : '') + '"><span title="' + escapeHtml(field.english_name) + '">' + label + '</span>' + termControl(field) + tenorNote + '</label>';
      }

      function renderParameters({ preserve = false } = {}) {
        if (!state.product) {
          renderSemanticRules();
          ['canvasDefaultButton', 'canvasPreviewButton', 'canvasSaveButton', 'applyParametersButton', 'restoreDefaultsButton'].forEach(id => { $(id).disabled = true; });
          $('bindingCard').innerHTML = '<span>尚未选择产品</span>';
          $('scenarioCount').textContent = '--';
          $('scenarioList').innerHTML = '<li class="preview">选择产品后显示</li>';
          $('inspectorTitle').textContent = '合同条款';
          $('sourceDetail').textContent = '选择路径查看条件与收益。';
          $('selectedPathDetail').textContent = '';
          renderSelectedPath();
          return;
        }
        const before = preserve ? Object.fromEntries(termInputs().map(item => [item.dataset.key, {
          value: item.value, unit: item.closest('.term-tenor')?.querySelector('.term-tenor-unit')?.value
        }])) : {};
        $('parameterFields').innerHTML = editablePayoffFields().map(termField).join('') || '<p class="parameter-empty">当前App合同未授权可编辑条款。</p>';
        renderSemanticRules();
        const tenorField = editablePayoffFields().find(field => field.key === 'T');
        if (tenorField) window.OptionHelperModulePresentation?.initializeTenorInput?.(termInputs().find(item => item.dataset.key === 'T'), defaultValue(tenorField));
        termInputs().forEach(item => {
          const prior = before[item.dataset.key];
          if (!prior) return;
          item.value = prior.value;
          const unit = item.closest('.term-tenor')?.querySelector('.term-tenor-unit');
          if (unit && prior.unit) unit.value = prior.unit;
        });
        const enabled = canRuntimePreview() && !state.saving && !state.moduleResetLoading;
        termInputs().forEach(input => {
          input.disabled = !enabled;
          input.removeAttribute('aria-disabled');
        });
        $('applyParametersButton').disabled = !enabled;
        $('restoreDefaultsButton').disabled = !enabled;
        $('canvasDefaultButton').disabled = false;
        $('canvasPreviewButton').disabled = !enabled;
        $('canvasSaveButton').disabled = !enabled || Boolean(state.previewFailed);
      }

      function parseTermValue(item) {
        if (item.validity?.badInput) throw new Error(item.dataset.key + '必须是有效数值');
        const raw = item.value.trim();
        if (!raw) return undefined;
        if (item.dataset.kind === 'number') {
          const value = Number(raw);
          if (!Number.isFinite(value)) throw new Error(item.dataset.key + '必须是有限数');
          if (item.dataset.key === 'T') {
            const unit = item.closest('.term-tenor')?.querySelector('.term-tenor-unit')?.value || 'year';
            return unit === 'month' ? value / 12 : unit === 'day' ? value / 365 : value;
          }
          if (item.dataset.encoding === 'percentage_input_decimal_internal') {
            // 与显示端采用同一十进制移位规则，默认值往返后不产生伪修改。
            const [coefficient, exponent = '0'] = String(value).split('e');
            return Number(`${coefficient}e${Number(exponent) - 2}`);
          }
          return value;
        }
        if (item.dataset.kind === 'boolean') return raw === 'true';
        if (item.dataset.kind === 'json') {
          try { return JSON.parse(raw); }
          catch (error) { throw new Error(item.dataset.key + '必须是JSON：' + error.message); }
        }
        return raw;
      }

      function parseFieldDefault(item) {
        try { return JSON.parse(item.dataset.default); }
        catch (error) { throw new Error(item.dataset.key + '的OptionReg默认值无法读取'); }
      }

      function isSameValue(left, right) {
        return JSON.stringify(stableValue(left)) === JSON.stringify(stableValue(right));
      }

      function stableValue(value) {
        if (Array.isArray(value)) return value.map(stableValue);
        if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(key => [key, stableValue(value[key])]));
        return value;
      }

      function hostEditSchema() {
        if (!hostedInDesk) return null;
        return state.product?.edit_schema || null;
      }

      function hostAllowsRequestField(field) {
        const fields = hostEditSchema()?.request_fields;
        return Array.isArray(fields) && fields.includes(field);
      }

      function editablePayoffFields() {
        if (!hostedInDesk) return state.product?.payoff_fields || [];
        const schema = hostEditSchema();
        const keys = schema?.overridable_term_keys;
        if (!hostAllowsRequestField('term_overrides')) return [];
        const fields = state.product?.payoff_fields || [];
        if (!Array.isArray(keys)) return fields;
        const allowed = new Set(keys);
        return fields.filter(field => allowed.has(field.key));
      }

      const fixedObservationRuleKeys = new Set(['O_KO', 'O_KI', 'Oc', 'Otouch', 'Orange', 'Ovar', 'Ohedge', 'Oreset']);

      function renderSemanticRules() {
        const rules = (state.product?.fixed_fields || []).filter(field => fixedObservationRuleKeys.has(field.key));
        const container = $('semanticRules');
        container.hidden = rules.length === 0;
        container.innerHTML = rules.map(field => {
          const value = window.OptionHelperModulePresentation?.termValueLabel?.(field.default_value) || String(field.default_value ?? '');
          return '<div class="semantic-rule"><span>' + escapeHtml(field.label) + '</span><strong>' + escapeHtml(value) + '</strong></div>';
        }).join('');
      }

      function collectTermOverrides() {
        const overrides = {};
        for (const item of termInputs()) {
          try {
            const value = parseTermValue(item);
            if (value === undefined) continue;
            validateTermDomain(item, value);
            const catalogDefault = parseFieldDefault(item);
            if (!isSameValue(value, catalogDefault)) overrides[item.dataset.key] = value;
          } catch (error) {
            error.fieldKey = item.dataset.key;
            throw error;
          }
        }
        return overrides;
      }

      function validateTermDomain(item, value) {
        // Bounds come from the current product catalog and apply after unit decoding.
        // Cross-field and path constraints remain the Core compiler's responsibility.
        if (typeof value !== 'number') return;
        const field = fieldForKey(item.dataset.key);
        const domain = field?.domain || {};
        const limits = [
          ['min', bound => value < bound, '不能小于'],
          ['exclusive_min', bound => value <= bound, '必须大于'],
          ['max', bound => value > bound, '不能大于'],
          ['exclusive_max', bound => value >= bound, '必须小于'],
        ];
        for (const [key, outside, message] of limits) {
          const bound = domain[key];
          if (typeof bound !== 'number' || !Number.isFinite(bound) || !outside(bound)) continue;
          let shown = displayValue(bound, field);
          let unit = displayUnit(field);
          if (item.dataset.key === 'T') {
            const selected = item.closest('.term-tenor')?.querySelector('.term-tenor-unit')?.value || 'year';
            shown = String(bound * (selected === 'month' ? 12 : selected === 'day' ? 365 : 1));
            unit = selected === 'month' ? '月' : selected === 'day' ? '自然日' : '年';
          }
          throw new Error((field.chinese_name || field.label || item.dataset.key) + message + shown + unit);
        }
      }

      function clearTermErrors() {
        for (const input of termInputs()) {
          const errorId = 'payoffer-term-error-' + input.dataset.key;
          const describedBy = (input.getAttribute('aria-describedby') || '').split(/\s+/).filter(id => id && id !== errorId);
          if (describedBy.length) input.setAttribute('aria-describedby', describedBy.join(' '));
          else input.removeAttribute('aria-describedby');
          input.removeAttribute('aria-invalid');
          document.getElementById(errorId)?.remove();
        }
      }

      function showTermError(error) {
        const input = termInputs().find(item => item.dataset.key === error.fieldKey);
        if (!input) return;
        const note = document.createElement('small');
        note.id = 'payoffer-term-error-' + input.dataset.key;
        note.className = 'field-error';
        note.setAttribute('role', 'alert');
        note.textContent = error.message;
        input.closest('.parameter-field').append(note);
        input.setAttribute('aria-invalid', 'true');
        input.setAttribute('aria-describedby', [input.getAttribute('aria-describedby'), note.id].filter(Boolean).join(' '));
        input.focus();
      }

      function buildRequestPayload() {
        if (!state.product) throw new Error('请选择产品');
        const payload = { product_id: state.product.product_id, term_overrides: collectTermOverrides() };
        if (hostedInDesk) {
          const renderOptions = collectRenderOptions();
          if (renderOptions) payload.render_options = renderOptions;
        }
        return payload;
      }

      function currentSignature() {
        return JSON.stringify(buildRequestPayload());
      }

      function markInputDirty() {
        if (state.saving || state.moduleResetLoading || !state.product || state.product.runtime_status !== 'enabled') return;
        clearTermErrors();
        $('noticeArea').replaceChildren();
        state.previewFailed = false;
        $('canvasSaveButton').disabled = !canRuntimePreview();
        state.inputsDirty = true;
        try {
          const current = state.previewSignature === currentSignature();
          setCanvasState(current ? '收益图已更新' : '条款待预览', current ? 'ready' : 'dirty');
        } catch (error) {
          setCanvasState('输入待修正');
        }
      }

      function renderLibrary() {
        if (!state.product) return;
        const previewPaths = state.preview?.path_panels || [];
        const catalogPaths = state.product.path_summaries || [];
        const pathCount = Math.max(catalogPaths.length, previewPaths.length);
        const paths = Array.from({ length: pathCount }, (_, index) => ({
          catalog: catalogPaths[index] || null,
          preview: previewPaths[index] || null
        }));
        const previewReady = previewPaths.length > 0;
        const scope = state.product.underlying_scope === 'multi_underlying' ? '多标的结构' : '单标的结构';
        $('bindingCard').innerHTML = '<strong>' + escapeHtml(state.product.product_id + ' ' + state.product.canonical_name) + '</strong><span>' + scope + '；' + pathCount + '条产品路径。</span>';
        $('scenarioCount').textContent = String(paths.length);
        $('scenarioList').innerHTML = paths.map(({ catalog, preview }, index) => {
          const title = catalog?.title || preview?.title || '路径' + (index + 1);
          const condition = catalog?.condition || preview?.condition_tex || preview?.condition || '全部情形';
          const interactive = previewReady && preview;
          const attributes = interactive ? ' data-path-index="' + index + '" role="button" tabindex="0" class="' + (index === state.selectedPathIndex ? 'selected' : '') + '"' : '';
          return '<li' + attributes + '><span class="scenario-title">' + escapeHtml(title) + '</span><span class="scenario-condition">' + mathHtml(condition === 'True' ? '全部情形' : condition) + '</span></li>';
        }).join('') || '<li class="preview">该产品未登记收益路径</li>';
        [...$('scenarioList').querySelectorAll('[data-path-index]')].forEach(item => {
          const selectPath = () => { state.selectedPathIndex = Number(item.dataset.pathIndex); renderLibrary(); renderSelectedPath(); };
          item.addEventListener('click', selectPath);
          item.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectPath(); } });
        });
      }

      function renderSelectedPath() {
        const path = state.preview?.path_panels?.[state.selectedPathIndex];
        if (!path) {
          $('inspectorTitle').textContent = '合同条款';
          $('sourceDetail').textContent = state.preview?.runtime_status === 'blocked'
            ? '当前产品仅提供默认图。'
            : state.product ? runtimeAvailabilityMessage() : '选择路径查看条件与收益。';
          $('selectedPathDetail').textContent = '';
          return;
        }
        $('inspectorTitle').textContent = '合同条款';
        $('sourceDetail').innerHTML = '当前路径条件：' + mathHtml(path.condition_tex || '—');
        $('selectedPathDetail').innerHTML = '<span class="formula">收益口径：百分比</span><span class="formula">分段数：' + (path.segments?.length || 0) + '</span>';
      }

      function setZoom(value, { mode = 'manual' } = {}) {
        state.zoom = Math.max(.1, Math.min(2, Number(value) || 1));
        state.zoomMode = mode;
        $('zoomInput').value = String(Math.round(state.zoom * 100));
        $('canvasViewport').classList.toggle('fit-mode', mode === 'fit');
        const stage = $('canvasViewport').querySelector('.canvas-stage');
        if (stage) {
          stage.style.width = String(Number(stage.dataset.canvasWidth) * state.zoom) + 'px';
          stage.style.height = String(Number(stage.dataset.canvasHeight) * state.zoom) + 'px';
        }
        updateCanvasPanState();
      }

      function updateCanvasPanState() {
        const viewport = $('canvasViewport');
        requestAnimationFrame(() => {
          const stage = viewport.querySelector('.canvas-stage');
          const canPan = Boolean(stage) && (
            viewport.scrollWidth > viewport.clientWidth + 1 ||
            viewport.scrollHeight > viewport.clientHeight + 1
          );
          viewport.classList.toggle('pan-ready', canPan);
          if (!canPan) finishCanvasPan();
        });
      }

      function finishCanvasPan(event) {
        const viewport = $('canvasViewport');
        if (canvasPan && (!event || event.pointerId === undefined || event.pointerId === canvasPan.pointerId)) {
          const pointerId = canvasPan.pointerId;
          canvasPan = null;
          viewport.classList.remove('is-panning');
          if (viewport.hasPointerCapture?.(pointerId)) viewport.releasePointerCapture(pointerId);
        }
      }

      function resetCanvasPan() {
        finishCanvasPan();
        const viewport = $('canvasViewport');
        viewport.scrollLeft = 0;
        viewport.scrollTop = 0;
        viewport.classList.remove('pan-ready', 'is-panning');
      }

      function startCanvasPan(event) {
        const viewport = $('canvasViewport');
        if (event.button !== 0 || event.isPrimary === false || !viewport.classList.contains('pan-ready')) return;
        if (!event.target.closest('.canvas-stage')) return;
        event.preventDefault();
        canvasPan = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          scrollLeft: viewport.scrollLeft,
          scrollTop: viewport.scrollTop
        };
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add('is-panning');
      }

      function moveCanvasPan(event) {
        if (!canvasPan || event.pointerId !== canvasPan.pointerId) return;
        const viewport = $('canvasViewport');
        event.preventDefault();
        viewport.scrollLeft = canvasPan.scrollLeft - (event.clientX - canvasPan.startX);
        viewport.scrollTop = canvasPan.scrollTop - (event.clientY - canvasPan.startY);
      }

      function fitZoom() {
        const viewport = $('canvasViewport');
        const stage = viewport.querySelector('.canvas-stage');
        if (!stage) return;
        const style = getComputedStyle(viewport);
        const availableWidth = viewport.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        const availableHeight = viewport.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        const naturalWidth = Number(stage.dataset.canvasWidth) || 1200;
        const naturalHeight = Number(stage.dataset.canvasHeight) || 800;
        setZoom(Math.min(1, availableWidth / naturalWidth, availableHeight / naturalHeight), { mode: 'fit' });
        viewport.scrollLeft = Math.max(0, (stage.offsetWidth - availableWidth) / 2);
        viewport.scrollTop = 0;
        updateCanvasPanState();
      }

      function canvasDimension(input, naturalValue, label) {
        if (input.dataset.custom !== 'true') return naturalValue;
        const value = Number(input.value);
        const minimum = Number(input.min);
        const maximum = Number(input.max);
        if (!Number.isInteger(value) || value < minimum || value > maximum) {
          throw new Error(label + '必须是' + minimum + '至' + maximum + '之间的整数像素值');
        }
        return value;
      }

      function requestedCanvasDimensions() {
        const stage = $('canvasViewport').querySelector('.canvas-stage');
        // Export controls work before the default image arrives. These fallbacks
        // match the renderer's base canvas; an existing image supplies its own size.
        const naturalWidth = Number(stage?.dataset.naturalCanvasWidth) || 1200;
        const naturalHeight = Number(stage?.dataset.naturalCanvasHeight) || 566;
        const width = canvasDimension($('canvasWidth'), naturalWidth, '图片宽度');
        const height = canvasDimension($('canvasHeight'), naturalHeight, '图片高度');
        return { width, height };
      }

      function collectRenderOptions() {
        // Natural layout belongs to the renderer, not a previously loaded SVG.
        // Omitting untouched dimensions also keeps the request stable when that SVG arrives.
        if ([$('canvasWidth'), $('canvasHeight')].every(input => input.dataset.custom !== 'true')) return undefined;
        return requestedCanvasDimensions();
      }

      function markCanvasSizeDirty() {
        if (!state.product || state.product.runtime_status !== 'enabled') return;
        state.inputsDirty = true;
        try {
          const current = state.previewSignature === currentSignature();
          setCanvasState(current ? '收益图已更新' : '尺寸待应用', current ? 'ready' : 'dirty');
        } catch (error) {
          setCanvasState('尺寸待修正');
        }
      }

      function updateCanvasDimension(event) {
        const input = event.currentTarget;
        const custom = input.value.trim() !== '';
        input.dataset.custom = String(custom);
        input.setCustomValidity('');
        if (!custom) return markCanvasSizeDirty();
        try {
          requestedCanvasDimensions();
          markCanvasSizeDirty();
        }
        catch (error) { input.setCustomValidity(error.message); }
      }

      function commitCanvasDimension(event) {
        updateCanvasDimension(event);
        event.currentTarget.reportValidity();
      }

      function zoomAtPointer(event) {
        const viewport = $('canvasViewport');
        const stage = viewport.querySelector('.canvas-stage');
        if (!stage) return;
        event.preventDefault();
        const delta = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? event.deltaY * 16 : event.deltaY;
        const previousZoom = state.zoom;
        const nextZoom = Math.max(.1, Math.min(2, previousZoom * Math.exp(-delta * .0015)));
        if (Math.abs(nextZoom - previousZoom) < .001) return;
        const bounds = viewport.getBoundingClientRect();
        const pointerX = event.clientX - bounds.left;
        const pointerY = event.clientY - bounds.top;
        const contentX = viewport.scrollLeft + pointerX;
        const contentY = viewport.scrollTop + pointerY;
        const ratio = nextZoom / previousZoom;
        setZoom(nextZoom);
        viewport.scrollLeft = Math.max(0, contentX * ratio - pointerX);
        viewport.scrollTop = Math.max(0, contentY * ratio - pointerY);
      }

      function bindResizer(resizer, variable, minimum, maximum) {
        let startX = 0;
        let startValue = 0;
        const current = () => parseInt(getComputedStyle($('workbench')).getPropertyValue(variable), 10) || minimum;
        const setWidth = value => {
          const next = Math.max(minimum, Math.min(maximum, value));
          $('workbench').style.setProperty(variable, String(next) + 'px');
          resizer.setAttribute('aria-valuenow', String(next));
        };
        const finish = () => {
          resizer.classList.remove('active');
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', finish);
        };
        const move = event => {
          const delta = variable === '--library-width' ? event.clientX - startX : startX - event.clientX;
          setWidth(startValue + delta);
        };
        resizer.setAttribute('aria-valuemin', String(minimum));
        resizer.setAttribute('aria-valuemax', String(maximum));
        resizer.setAttribute('aria-valuenow', String(current()));
        resizer.addEventListener('pointerdown', event => {
          startX = event.clientX;
          startValue = current();
          resizer.classList.add('active');
          document.addEventListener('pointermove', move);
          document.addEventListener('pointerup', finish);
        });
        resizer.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
          event.preventDefault();
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          const delta = variable === '--library-width' ? direction * 10 : -direction * 10;
          setWidth(current() + delta);
        });
      }

      function createCanvasStage(svgSource) {
        const svg = safeSvgElement(svgSource);
        const viewBox = String(svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
        const naturalWidth = viewBox.length === 4 && Number.isFinite(viewBox[2]) && viewBox[2] > 0 ? viewBox[2] : parseFloat(svg.getAttribute('width')) || 1200;
        const naturalHeight = viewBox.length === 4 && Number.isFinite(viewBox[3]) && viewBox[3] > 0 ? viewBox[3] : parseFloat(svg.getAttribute('height')) || 800;
        const width = canvasDimension($('canvasWidth'), naturalWidth, '图片宽度');
        const height = canvasDimension($('canvasHeight'), naturalHeight, '图片高度');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        svg.setAttribute('width', String(width));
        svg.setAttribute('height', String(height));
        const stage = document.createElement('div');
        stage.className = 'canvas-stage';
        stage.dataset.naturalCanvasWidth = String(naturalWidth);
        stage.dataset.naturalCanvasHeight = String(naturalHeight);
        stage.dataset.canvasWidth = String(width);
        stage.dataset.canvasHeight = String(height);
        stage.style.width = String(width) + 'px';
        stage.style.height = String(height) + 'px';
        if ($('canvasWidth').dataset.custom !== 'true') $('canvasWidth').value = String(Math.round(naturalWidth));
        if ($('canvasHeight').dataset.custom !== 'true') $('canvasHeight').value = String(Math.round(naturalHeight));
        stage.replaceChildren(svg);
        return stage;
      }

      const payoffViewer = { source: null, productId: null, returnFocus: null, mode: 'fit', width: 0, height: 0 };

      function syncPayoffViewer() {
        const stage = $('canvasViewport').querySelector('.canvas-stage');
        $('canvasExpandButton').disabled = !state.product || !stage?.querySelector('svg');
        if (payoffViewer.source && (payoffViewer.source !== stage || payoffViewer.productId !== state.product?.product_id)) closePayoffViewer();
      }

      function sizePayoffViewer(mode = payoffViewer.mode) {
        if (!$('payoffViewerDialog').open || !payoffViewer.source) return;
        payoffViewer.mode = mode;
        const viewport = $('payoffViewerViewport');
        const padding = getComputedStyle(viewport);
        const width = Math.max(1, viewport.clientWidth - parseFloat(padding.paddingLeft) - parseFloat(padding.paddingRight));
        const height = Math.max(1, viewport.clientHeight - parseFloat(padding.paddingTop) - parseFloat(padding.paddingBottom));
        const scale = mode === 'actual' ? 1 : Math.min(1, width / payoffViewer.width, height / payoffViewer.height);
        $('payoffViewerStage').style.width = String(payoffViewer.width * scale) + 'px';
        $('payoffViewerStage').style.height = String(payoffViewer.height * scale) + 'px';
        $('payoffViewerFitButton').setAttribute('aria-pressed', String(mode === 'fit'));
        $('payoffViewerActualButton').setAttribute('aria-pressed', String(mode === 'actual'));
        if (mode === 'fit') { viewport.scrollLeft = 0; viewport.scrollTop = 0; }
      }

      function openPayoffViewer() {
        syncPayoffViewer();
        const dialog = $('payoffViewerDialog');
        if ($('canvasExpandButton').disabled || dialog.open) return;
        const source = $('canvasViewport').querySelector('.canvas-stage');
        payoffViewer.source = source;
        payoffViewer.productId = state.product.product_id;
        payoffViewer.returnFocus = $('canvasExpandButton');
        payoffViewer.width = Number(source.dataset.canvasWidth);
        payoffViewer.height = Number(source.dataset.canvasHeight);
        // Clone the current sanitized SVG. Viewing never changes the canvas or export settings.
        $('payoffViewerStage').replaceChildren(source.querySelector('svg').cloneNode(true));
        $('payoffViewerViewport').scrollLeft = 0;
        $('payoffViewerViewport').scrollTop = 0;
        dialog.showModal();
        sizePayoffViewer('fit');
        $('payoffViewerCloseButton').focus();
        requestAnimationFrame(() => { syncPayoffViewer(); sizePayoffViewer(); });
      }

      function closePayoffViewer(restoreFocus = true) {
        const dialog = $('payoffViewerDialog');
        if (!dialog.open) return;
        const returnFocus = payoffViewer.returnFocus;
        dialog.close();
        payoffViewer.source = null;
        payoffViewer.productId = null;
        payoffViewer.returnFocus = null;
        $('payoffViewerStage').replaceChildren();
        if (restoreFocus) {
          const target = returnFocus?.isConnected && !returnFocus.disabled ? returnFocus
            : $('canvasExpandButton').disabled ? $('productSelect') : $('canvasExpandButton');
          target.focus();
        }
      }

      function setupPayoffViewer() {
        for (const id of ['canvasExpandButton', 'payoffViewerDialog', 'payoffViewerFitButton', 'payoffViewerActualButton', 'payoffViewerCloseButton', 'payoffViewerViewport', 'payoffViewerStage']) {
          if (!$(id)) throw new Error('Missing payoff viewer control: ' + id);
        }
        $('canvasExpandButton').addEventListener('click', openPayoffViewer);
        $('payoffViewerFitButton').addEventListener('click', () => sizePayoffViewer('fit'));
        $('payoffViewerActualButton').addEventListener('click', () => sizePayoffViewer('actual'));
        $('payoffViewerCloseButton').addEventListener('click', () => closePayoffViewer());
        $('payoffViewerDialog').addEventListener('cancel', event => { event.preventDefault(); closePayoffViewer(); });
        $('payoffViewerDialog').addEventListener('keydown', event => {
          if (event.key !== 'Tab') return;
          // WebKit can skip buttons in its default Tab navigation; keep this dialog's complete order explicit.
          const controls = [$('payoffViewerFitButton'), $('payoffViewerActualButton'), $('payoffViewerCloseButton'), $('payoffViewerViewport')];
          const current = controls.indexOf(document.activeElement);
          const next = current < 0 ? (event.shiftKey ? controls.length - 1 : 0)
            : (current + (event.shiftKey ? -1 : 1) + controls.length) % controls.length;
          event.preventDefault();
          controls[next].focus();
        });
        // Every preview/default/placeholder replaces this node's children; never cache an old product image.
        new MutationObserver(syncPayoffViewer).observe($('canvasViewport'), { childList: true });
        observeCanvasSize($('payoffViewerViewport'), () => sizePayoffViewer());
        document.addEventListener('optionhelper:modulevisibility', event => { if (event.detail?.active === false) closePayoffViewer(false); });
        syncPayoffViewer();
      }

      function observeCanvasSize(viewport, update) {
        let pending = false;
        new ResizeObserver(() => {
          if (pending) return;
          pending = true;
          // A layout write inside ResizeObserver can recursively resize its own viewport in WebKit.
          requestAnimationFrame(() => { pending = false; update(); });
        }).observe(viewport);
      }

      function showPreviewPlaceholder(title, message) {
        resetCanvasPan();
        const empty = document.createElement('div');
        empty.className = 'empty-canvas';
        empty.id = 'emptyCanvas';
        const copy = document.createElement('p');
        copy.textContent = message;
        empty.append(copy);
        $('canvasViewport').replaceChildren(empty);
        $('noticeArea').replaceChildren();
        setCanvasState(title === '等待运行' ? '等待运行' : title);
      }

      function renderPreview(response, signature, payload) {
        const stage = createCanvasStage(response.svg);
        $('canvasViewport').replaceChildren(stage);
        state.preview = response.preview;
        state.defaultExample = null;
        state.previewSignature = signature;
        state.previewPayload = payload;
        state.inputsDirty = false;
        state.selectedPathIndex = 0;
        requestAnimationFrame(() => {
          if (state.zoomMode === 'fit') fitZoom();
          else setZoom(state.zoom);
          updateCanvasPanState();
        });
        renderLibrary();
        renderSelectedPath();
        const enabled = state.preview.runtime_status === 'enabled';
        let current = false;
        try { current = enabled && state.previewSignature === currentSignature(); }
        catch (error) { current = false; }
        setCanvasState(enabled ? (current ? '收益图已更新' : '条款待预览') : '正式资料图已载入', current || !enabled ? 'ready' : 'dirty');
        showNotice(enabled
          ? '已按当前输入计算' + state.preview.path_panels.length + '条收益路径。'
          : '已载入正式默认图。');
      }

      function renderDefaultExample(response) {
        state.preview = null;
        state.defaultExample = response;
        state.previewPayload = null;
        state.previewSignature = null;
        state.inputsDirty = false;
        state.selectedPathIndex = 0;
        $('canvasViewport').replaceChildren(createCanvasStage(response.svg));
        requestAnimationFrame(() => {
          if (state.zoomMode === 'fit') fitZoom();
          else setZoom(state.zoom);
          updateCanvasPanState();
        });
        renderLibrary();
        renderSelectedPath();
        setCanvasState('正式默认图', 'ready');
        showNotice('已载入只读默认图。');
      }

      async function loadDefaultExample() {
        if (!state.product) return;
        const productId = state.product.product_id;
        const requestId = ++state.canvasRequestId;
        let response;
        try {
          response = await request('/api/default', { product_id: productId });
        } catch (error) {
          if (requestId !== state.canvasRequestId || state.product?.product_id !== productId) return;
          throw error;
        }
        if (requestId !== state.canvasRequestId || state.product?.product_id !== productId || response.product_id !== productId) return;
        renderDefaultExample(response);
      }

      async function request(path, body) {
        const response = await fetch(apiUrl(path), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
        let data;
        try { data = await response.json(); }
        catch (error) { throw new Error('本机服务未返回有效JSON'); }
        if (!response.ok || !data.ok) throw new Error(data.message || '本机服务返回错误');
        return data;
      }

      async function loadServiceStatus() {
        if (hostedInDesk) {
          // Desk uses Module Host Bridge for catalog, preview and run.  The
          // standalone /api/status endpoint is intentionally not part of the
          // formal Tool contract, so never request it from the App origin.
          return { ok: true, module: 'payoffer', host: 'optdesk' };
        }
        const response = await fetch(apiUrl('/api/status'));
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || '无法读取服务状态');
        return data;
      }

      async function preview() {
        const requestId = ++state.canvasRequestId;
        let failureState = '输入待修正';
        try {
          clearTermErrors();
          $('noticeArea').replaceChildren();
          if (state.moduleResetLoading) throw new Error('正在恢复默认参数，请稍候。');
          if (!canRuntimePreview()) throw new Error(runtimeAvailabilityMessage());
          const payload = buildRequestPayload();
          const signature = JSON.stringify(payload);
          const productId = state.product.product_id;
          failureState = '运行失败';
          setCanvasState('正在解析合同', 'busy');
          const data = await request('/api/preview', payload);
          if (requestId !== state.canvasRequestId || state.product?.product_id !== productId) return;
          renderPreview(data, signature, payload);
          state.previewFailed = false;
          $('canvasSaveButton').disabled = state.saving || state.moduleResetLoading || !canRuntimePreview();
          return data;
        } catch (error) {
          if (requestId === state.canvasRequestId) {
            state.previewFailed = true;
            $('canvasSaveButton').disabled = true;
            setCanvasState(failureState);
            showTermError(error);
            showNotice(error.message, 'error');
          }
          throw error;
        }
      }

      async function saveRuntime() {
        if (state.saving || state.moduleResetLoading) return;
        if (!state.product) return showNotice('请先选择产品。', 'error');
        if (!canRuntimePreview()) return showNotice(runtimeAvailabilityMessage(), 'error');
        const productId = state.product.product_id;
        const saveRequestId = ++state.saveRequestId;
        state.saving = true;
        setRuntimeInputsLocked(true);
        setCanvasState('正在保存', 'busy');
        try {
          const current = currentSignature();
          if (!state.preview || state.previewSignature !== current) await preview();
          if (saveRequestId !== state.saveRequestId || state.product?.product_id !== productId || currentSignature() !== current) return;
          const displayContract = state.preview?.display_contract;
          if (!displayContract || displayContract.projection_status !== 'display_only') {
            throw new Error('当前条款尚未完成预览，请检查后重试。');
          }
          const runPayload = state.previewPayload;
          await request('/api/run', runPayload);
          if (saveRequestId !== state.saveRequestId || state.product?.product_id !== productId || currentSignature() !== current || state.previewPayload !== runPayload) return;
          showNotice(runtimeSuccessNotice());
          setCanvasState('结果已保存', 'ready');
          state.hasSavedResult = true;
        } catch (error) {
          if (saveRequestId !== state.saveRequestId || state.product?.product_id !== productId) return;
          state.previewFailed = true;
          clearTermErrors();
          showTermError(error);
          setCanvasState('保存失败');
          showNotice(error.message, 'error');
          throw error;
        } finally {
          if (saveRequestId === state.saveRequestId) {
            state.saving = false;
            setRuntimeInputsLocked(false);
            termInputs().find(input => input.getAttribute('aria-invalid') === 'true')?.focus();
            if (typeof requestModuleInputReset === 'function') requestModuleInputReset();
          }
        }
      }

      function restoreDefaults() {
        if (state.moduleResetLoading || !state.product || !canRuntimePreview()) return;
        renderParameters();
        markInputDirty();
        showNotice('已恢复默认合同与条款；预览后更新收益图。');
      }

      async function planDefaultMaintenance() {
        if (!state.product || !state.maintenanceEnabled || !localDevelopmentPreview || hostedInDesk) {
          throw new Error('默认图维护只在本机显式管理员维护进程中可用。');
        }
        const productId = state.product.product_id;
        const reason = $('maintenanceReason').value.trim();
        const requestId = ++state.maintenanceRequestId;
        state.maintenancePlan = null;
        $('maintenanceConfirmation').disabled = true;
        $('maintenancePublishButton').disabled = true;
        $('maintenancePlanDetail').textContent = '正在生成维护计划。';
        let response;
        try {
          response = await request('/api/default-maintenance/plan', { product_id: productId, reason });
        } catch (error) {
          if (requestId !== state.maintenanceRequestId || state.product?.product_id !== productId || $('maintenanceReason').value.trim() !== reason) return;
          throw error;
        }
        if (
          requestId !== state.maintenanceRequestId
          || state.product?.product_id !== productId
          || $('maintenanceReason').value.trim() !== reason
        ) return;
        state.maintenancePlan = response;
        const changes = response.changes || [];
        $('maintenancePlanDetail').textContent = changes.length
          ? '计划包含' + changes.length + '项差异：' + changes.map(item => item.changed_fields.join('、')).join('；')
          : '当前产品没有需要发布的默认资产差异。';
        $('maintenanceConfirmation').value = '';
        $('maintenanceConfirmation').placeholder = response.confirmation_text || '';
        $('maintenanceConfirmation').disabled = !changes.length;
        $('maintenancePublishButton').disabled = !changes.length;
      }

      async function publishDefaultMaintenance() {
        const plan = state.maintenancePlan;
        if (!plan?.approval_id || !state.product) throw new Error('请先生成当前产品的维护计划。');
        const response = await request('/api/default-maintenance/publish', {
          product_id: state.product.product_id,
          reason: $('maintenanceReason').value.trim(),
          approval_id: plan.approval_id,
          confirmation: $('maintenanceConfirmation').value.trim()
        });
        state.maintenancePlan = null;
        $('maintenanceConfirmation').value = '';
        $('maintenanceConfirmation').disabled = true;
        $('maintenancePublishButton').disabled = true;
        $('maintenancePlanDetail').textContent = '已发布' + response.updated_assets + '项默认资产；请重新读取资料库。';
        showNotice('默认图维护已完成。');
      }

      function clearMaintenancePlan() {
        state.maintenanceRequestId += 1;
        state.maintenancePlan = null;
        $('maintenanceConfirmation').value = '';
        $('maintenanceConfirmation').disabled = true;
        $('maintenancePublishButton').disabled = true;
        $('maintenancePlanDetail').textContent = '尚未生成维护计划。';
      }

      async function selectProduct() {
        if (state.saving) {
          $('productSelect').value = state.product?.product_id || '';
          return;
        }
        state.canvasRequestId += 1;
        clearMaintenancePlan();
        state.previewFailed = false;
        state.product = state.products.find(product => product.product_id === $('productSelect').value) || null;
        rememberProductId(state.product?.product_id || '');
        state.preview = null;
        state.defaultExample = null;
        state.previewPayload = null;
        state.previewSignature = null;
        state.selectedPathIndex = 0;
        state.inputsDirty = false;
        if (!state.product) {
          updateRuntimeChrome();
          showPreviewPlaceholder('尚未选择产品', '请从左侧选择一个产品。');
          return;
        }
        state.zoomMode = 'fit';
        updateRuntimeChrome();
        renderLibrary();
        renderSelectedPath();
        showPreviewPlaceholder('正在读取默认图', '正在读取默认图。');
        try {
          await loadDefaultExample();
        } catch (error) {
          showPreviewPlaceholder('默认图读取失败', error.message);
          showNotice(error.message, 'error');
        }
      }

      async function loadCatalog() {
        const contractRequestId = ++state.catalogRequestId;
        const serviceStatus = await loadServiceStatus();
        state.maintenanceEnabled = Boolean(serviceStatus.default_maintenance_enabled);
        let response;
        try { response = await fetch(apiUrl('/api/catalog')); }
        catch (error) {
          if (contractRequestId !== state.catalogRequestId) return;
          throw error;
        }
        let data;
        try { data = await response.json(); }
        catch (error) {
          if (contractRequestId !== state.catalogRequestId) return;
          throw new Error('产品目录未返回有效JSON');
        }
        if (contractRequestId !== state.catalogRequestId) return;
        if (!response.ok || !data.ok) throw new Error(data.message || '产品目录读取失败');
        state.products = data.products;
        $('productSelect').replaceChildren(new Option('请选择产品',''), ...data.products.map(product => new Option(product.product_id + ' ' + product.canonical_name, product.product_id)));
        const remembered = savedProductId();
        $('productSelect').value = data.products.some(product => product.product_id === remembered) ? remembered : '';
        await selectProduct();
      }

      function moduleResetBusy() { return state.saving || state.moduleResetLoading; }
      function requestModuleInputReset() { if (!state.resetOnActivation || !state.moduleVisible || moduleResetBusy()) return; state.resetOnActivation = false; void refreshModuleDefaultsAfterReopen(); }
      async function refreshModuleDefaultsAfterReopen() {
        state.moduleResetLoading = true;
        state.canvasRequestId += 1;
        state.preview = null;
        state.previewPayload = null;
        state.previewSignature = null;
        state.inputsDirty = true;
        setRuntimeInputsLocked(true);
        try {
          await loadCatalog();
          setRuntimeInputsLocked(true);
          showNotice('已恢复默认参数。');
        } catch (error) {
          showNotice(error.message || '重新读取最新产品默认值失败。', 'error');
        } finally {
          state.moduleResetLoading = false;
          setRuntimeInputsLocked(false);
          requestModuleInputReset();
        }
      }
      function handleModuleVisibility(event) { state.moduleVisible = event.detail?.active !== false; if (state.moduleVisible && event.detail?.reopened) { state.resetOnActivation = true; requestModuleInputReset(); } }

      function bindPageControls() {
      $('productSelect').addEventListener('change', () => selectProduct().catch(error => showNotice(error.message, 'error')));
      $('applyParametersButton').addEventListener('click', () => preview().catch(() => {}));
      $('restoreDefaultsButton').addEventListener('click', restoreDefaults);
      $('canvasPreviewButton').addEventListener('click', () => preview().catch(() => {}));
      $('canvasDefaultButton').addEventListener('click', () => loadDefaultExample().catch(error => showNotice(error.message, 'error')));
      $('canvasSaveButton').addEventListener('click', () => saveRuntime().catch(() => {}));
      $('recheckButton').addEventListener('click', () => loadCatalog().then(() => showNotice('产品目录已重新读取。')).catch(error => showNotice(error.message, 'error')));
      $('maintenancePlanButton').addEventListener('click', () => planDefaultMaintenance().catch(error => showNotice(error.message, 'error')));
      $('maintenancePublishButton').addEventListener('click', () => publishDefaultMaintenance().catch(error => showNotice(error.message, 'error')));
      $('maintenanceReason').addEventListener('input', clearMaintenancePlan);
      $('zoomOutButton').addEventListener('click', () => setZoom(state.zoom - .05));
      $('zoomInButton').addEventListener('click', () => setZoom(state.zoom + .05));
      $('zoomInput').addEventListener('input', event => setZoom(Number(event.target.value) / 100));
      $('zoomFitButton').addEventListener('click', fitZoom);
      $('canvasWidth').addEventListener('input', updateCanvasDimension);
      $('canvasHeight').addEventListener('input', updateCanvasDimension);
      $('canvasWidth').addEventListener('change', commitCanvasDimension);
      $('canvasHeight').addEventListener('change', commitCanvasDimension);
      $('canvasViewport').addEventListener('wheel', zoomAtPointer, { passive: false });
      $('canvasViewport').addEventListener('pointerdown', startCanvasPan);
      $('canvasViewport').addEventListener('pointermove', moveCanvasPan);
      $('canvasViewport').addEventListener('pointerup', finishCanvasPan);
      $('canvasViewport').addEventListener('pointercancel', finishCanvasPan);
      $('canvasViewport').addEventListener('lostpointercapture', finishCanvasPan);
      window.addEventListener('blur', finishCanvasPan);
      $('parameterFields').addEventListener('input', markInputDirty);
      $('parameterFields').addEventListener('change', markInputDirty);
      document.addEventListener('optionhelper:modulevisibility', handleModuleVisibility);
      }

      async function initializePayoffer() {
        let stage = '页面控件初始化';
        let viewerUnavailable = false;
        try {
          bindPageControls();
          // The optional viewer must not prevent the product catalog or the core controls from loading.
          try { setupPayoffViewer(); }
          catch (error) {
            viewerUnavailable = true;
            if ($('canvasExpandButton')) $('canvasExpandButton').disabled = true;
            console.error('Payoffer viewer initialization failed', error);
          }
          stage = '画布初始化';
          bindResizer($('libraryResizer'), '--library-width', 220, 420);
          bindResizer($('inspectorResizer'), '--inspector-width', 300, 520);
          observeCanvasSize($('canvasViewport'), () => { if (state.zoomMode === 'fit' && $('canvasViewport').querySelector('.canvas-stage')) fitZoom(); });
          stage = '产品目录读取';
          setServiceStatus('正在读取产品目录');
          updateRuntimeChrome();
          await loadCatalog();
          setServiceStatus(hostedInDesk ? 'Desk运行服务已连接' : '本机服务已连接');
          if (viewerUnavailable) showNotice('收益图放大查看暂不可用，请重新打开收益结构。', 'error');
          else if (location.protocol === 'file:') showNotice('已连接本机服务。结果属于开发预览，正式交付须通过OptionHelper生成。');
        } catch (error) {
          setServiceStatus(stage + '失败', true);
          console.error('Payoffer initialization failed: ' + stage, error);
          const message = location.protocol === 'file:'
            ? '请先双击同目录的payoffer.command启动服务，再点击“重新读取资料库”。'
            : error.message;
          showNotice(message, 'error');
        }
      }

      void initializePayoffer();
    </script>
  </body>
</html>
