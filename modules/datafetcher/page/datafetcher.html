<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据获取 | OptionHelper</title>
  <link rel="icon" href="../../icons/optionhelper-app-icon-tile-light.svg">
  <link rel="alternate icon" href="../../../assets/icons/optionhelper-app-icon-tile-light.svg">
  <link rel="stylesheet" href="./datafetcher.css">
  <link rel="stylesheet" href="../module-host-presentation.css">
  <link rel="stylesheet" href="../date-input-control.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="../../icons/optionhelper-logo.svg" onerror="this.onerror=null;this.src='../../../assets/icons/optionhelper-logo.svg'" alt="OptionHelper"><span class="brand-separator"></span><span class="module-title">数据获取</span></div>
      <p class="topbar-status" id="service-status">正在检查本机服务</p>
    </header>
    <main class="workbench" id="workbench">
      <aside class="library-panel">
        <div class="library-heading"><h1>数据资产</h1></div>
        <div class="asset-filter"><label class="sr-only" for="asset-search">搜索数据</label><input id="asset-search" class="control" type="search" placeholder="搜索标的或日期" title="搜索标的或日期"><button class="button button-quiet library-refresh" id="refresh-assets" type="button" aria-label="刷新数据资产和连接状态" title="刷新数据资产和连接状态"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.7 6.2A6.5 6.5 0 1 0 16.4 13"/><path d="M15.7 2.8v3.8h-3.8"/></svg><span class="sr-only">刷新</span></button></div>
        <div class="asset-list" id="asset-list" aria-live="polite"><p class="empty-list">当前任务尚无数据资产。</p></div>
      </aside>
      <div class="panel-resizer panel-resizer-left" id="library-resizer" role="separator" aria-label="调整数据资产面板宽度" aria-orientation="vertical" tabindex="0"></div>
      <section class="canvas-panel">
        <div class="canvas-toolbar">
          <div class="canvas-state"><span class="state-dot" id="state-dot"></span><span id="canvas-state">等待数据请求</span></div>
          <div class="canvas-toolbar-actions"><button class="button button-primary" id="submit-request" type="submit" form="request-form">获取数据</button></div>
        </div>
        <div class="notice" id="notice" hidden aria-live="polite"></div>
        <div class="canvas-viewport">
          <section class="result-sheet" id="result-sheet">
            <div class="empty-canvas" id="empty-canvas"><strong>尚无数据结果</strong><span>填写请求参数后获取数据。</span></div>
            <div id="result-content" hidden></div>
          </section>
        </div>
      </section>
      <div class="panel-resizer panel-resizer-right" id="inspector-resizer" role="separator" aria-label="调整数据请求面板宽度" aria-orientation="vertical" tabindex="0"></div>
      <aside class="inspector-panel">
        <form id="request-form" novalidate>
          <h2>数据请求</h2>
          <section class="inspector-group">
            <h3>请求范围</h3>
            <label class="control-field" for="asset-ids"><span>资产标识</span><textarea id="asset-ids" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" required aria-describedby="asset-ids-error" placeholder="例如000300.SH"></textarea><small class="field-error" id="asset-ids-error" role="alert"></small></label>
            <div class="control-grid"><label class="control-field" for="start-date"><span>开始日期</span><input class="date-input" id="start-date" type="text" inputmode="numeric" autocomplete="off" placeholder="yyyy/mm/dd" required aria-describedby="start-date-hint start-date-error"><small id="start-date-hint">按自然日填写。</small><small class="field-error" id="start-date-error" role="alert"></small></label><label class="control-field" for="end-date"><span>结束日期</span><input class="date-input" id="end-date" type="text" inputmode="numeric" autocomplete="off" placeholder="yyyy/mm/dd" required aria-describedby="end-date-hint end-date-error"><small id="end-date-hint">不得早于开始日期。</small><small class="field-error" id="end-date-error" role="alert"></small></label></div>
          </section>
          <section class="inspector-group">
            <h3>数据口径</h3>
            <div class="read-only-row"><span>频率</span><strong>日频</strong></div>
            <input id="frequency" type="hidden" value="1d">
            <label class="control-field" for="adjustment"><span>复权口径</span><select id="adjustment"><option value="auto" selected>按资产自动适配</option><option value="none">不复权</option><option value="forward">前复权</option></select></label>
            <div class="read-only-row"><span>行情字段</span><strong id="field-summary">全部字段</strong></div>
            <details class="advanced-options" id="field-options"><summary>选择字段</summary>
              <div class="field-choice-grid" aria-label="选择行情字段">
                <label class="check-field"><input class="extra-field" type="checkbox" value="open" checked><span>开盘价</span></label>
                <label class="check-field"><input class="extra-field" type="checkbox" value="high" checked><span>最高价</span></label>
                <label class="check-field"><input class="extra-field" type="checkbox" value="low" checked><span>最低价</span></label>
                <label class="check-field"><input class="extra-field" type="checkbox" value="close" checked disabled><span>收盘价</span></label>
                <label class="check-field"><input class="extra-field" type="checkbox" value="volume" checked><span>成交量</span></label>
              </div>
            </details>
          </section>
          <section class="inspector-group">
            <h3>数据来源</h3>
            <p class="retention-note">优先使用本地数据，覆盖不足时自动通过iFind补齐。</p>
            <section class="secret-card" id="ifind-status-card"><strong>连接状态</strong><span id="secret-status">正在读取连接状态。</span></section>
          </section>
          <section class="inspector-group">
            <h3>数据保存</h3>
            <label class="strategy-option"><input id="save-downloaded-data" type="checkbox"><span><strong>保存下载数据</strong><small>默认关闭；关闭后仅供本次使用，应用重启后需重新获取。</small></span></label>
          </section>
        </form>
      </aside>
    </main>
  </div>
  <script src="../module-host-presentation.js"></script>
  <script src="../module-host-bridge.js"></script>
  <script src="../date-input-control.js"></script>
  <script src="./datafetcher.js"></script>
</body>
</html>
