<!doctype html>
<!--
  Public reference-quote shell.
  Quote is a compact, fact-only delivery from one frozen reference_quote block.
  It groups structure-specific terms instead of forcing unlike products into
  one universal grid. No pricing, payoff or backtest chart is rendered here.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="designer-design-system" content="__DESIGN_SYSTEM_ID__">
<title>__TITLE__</title>
<style>
__REPORT_THEME__
</style>
</head>
<body class="designer-quote-page" data-output-type="quote" data-design-system="__DESIGN_SYSTEM_ID__">
<main>
  <article class="reference-quote" data-output-type="quote" data-design-system="__DESIGN_SYSTEM_ID__">
    <header class="quote-head">
      <div>
        <p class="quote-head__brand">__BRAND__</p>
        <h1>__TITLE__</h1>
      </div>
      <dl class="quote-identity">__IDENTITY__</dl>
    </header>
    __QUOTE_BODY__
  </article>
</main>
</body>
</html>
