<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>OptChat | OptionHelper</title>
    <script src="/app/frontend/shared/theme-bootstrap.js"></script>
    <link id="app-favicon" rel="icon" href="/app/assets/icons/optionhelper-app-icon-tile-light.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app/designer-token-vars.css">
    <link rel="stylesheet" href="/app/frontend/shared/styles.css">
    <link rel="stylesheet" href="/app/frontend/shared/refinement.css">
    <link rel="stylesheet" href="/app/frontend/shared/theme-overrides.css">
    <script type="module" src="/app/frontend/shared/theme.js"></script>
    <script type="module" src="/app/frontend/shared/ui-scale.js"></script>
    <script type="module" src="/app/frontend/shared/scrollbar-activity.js"></script>
    <link rel="stylesheet" href="/app/frontend/shared/user-guide.css">
    <link rel="stylesheet" href="/app/frontend/shared/position-size.css">
  </head>
  <body class="workspace-body workspace-body--initializing">
    <div class="workspace-shell workspace-shell--desk" data-workspace-shell data-mode="chat" data-switching="false" data-has-desk="false" data-report-open="false" data-initializing="true" aria-busy="true">
      <aside class="workspace-rail workspace-rail--unbranded">
        <section class="rail-mode-area" aria-label="工作模式"><div class="mode-switch mode-switch--rail" data-mode-switch><button type="button" data-mode="chat">OptChat</button></div></section>
        <button class="rail-new-task" type="button" data-new-task><span aria-hidden="true">＋</span><span class="rail-new-task__label">新建任务</span></button>
        <section class="task-rail" aria-label="任务历史"><p class="rail-section-label">最近任务</p><div class="task-list" id="rail-task-list" data-task-list></div></section>
        <footer class="rail-footer" data-account-menu-root>
          <button class="rail-account-trigger" type="button" data-account-menu-toggle aria-controls="account-menu" aria-expanded="false">
            <span class="rail-account-trigger__mark" data-account-avatar aria-hidden="true">U</span><strong class="rail-account-trigger__name" data-account-label>用户</strong>
          </button>
          <button class="rail-help-trigger" type="button" data-user-guide aria-label="打开使用说明" title="使用说明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 0 1 4.6 1c0 1.5-2.3 1.7-2.3 3.3"/><path d="M12 16.5h.01"/></svg></button>
          <div class="rail-account-menu" id="account-menu" role="menu" hidden>
            <div class="rail-account-menu__identity"><strong data-account-menu-label>用户</strong></div>
            <div class="rail-account-menu__separator" aria-hidden="true"></div>
            <a class="rail-account-menu__item" data-settings-link href="/settings" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><circle cx="12" cy="12" r="4"></circle></svg><span>设置中心</span></a>
            <button class="rail-account-menu__item rail-account-menu__item--logout" type="button" data-logout role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 5.5H6.75A2.75 2.75 0 0 0 4 8.25v7A2.75 2.75 0 0 0 6.75 18h3.75"></path><path d="M14 8.25 17.75 12 14 15.75M8.5 12h9.25"></path></svg><span>退出登录</span></button>
          </div>
        </footer>
      </aside>
      <div class="workspace-splitter workspace-splitter--rail" data-workspace-splitter="rail" role="separator" aria-label="调整任务栏宽度" aria-orientation="vertical" tabindex="0"></div>
      <main class="work-area">
        <header class="workbench-head"><div><h1 id="task-title">新建研究任务</h1></div><div class="workbench-head__actions"><button class="button-secondary button-secondary--head task-history-toggle" type="button" data-task-history-toggle aria-controls="mobile-task-drawer" aria-expanded="false" aria-label="打开任务历史" title="打开任务历史"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h8"></path></svg><span class="sr-only">打开任务历史</span></button><button class="button-secondary button-secondary--head report-drawer-toggle" type="button" data-report-toggle aria-controls="task-context" aria-expanded="false" aria-label="打开任务与交付" title="打开任务与交付"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.75" y="4.25" width="16.5" height="15.5" rx="2.5"></rect><path d="M14.25 4.25v15.5"></path></svg><span class="sr-only">打开任务与交付</span></button></div></header>
        <div class="workspace-content">
          <section class="chat-surface" id="chat-surface" aria-label="任务对话">
            <h2 class="sr-only" id="conversation-title">开始研究</h2>
            <div class="conversation-scroll-stage" id="chat-scroll-stage"><div class="message-stream" id="conversation-stream" data-runtime-process="true" aria-live="polite"></div><p class="sr-only" id="runtime-live-status" role="status" aria-live="polite" aria-atomic="true"></p></div>
          </section>
          <section class="desk-surface" id="desk-surface" aria-label="研究模块" aria-hidden="true" inert>
            <nav class="desk-module-tabs" id="module-tabs" role="tablist" aria-label="研究模块"><span class="desk-module-tabs__indicator" aria-hidden="true"></span><button type="button" role="tab" data-module="datafetcher" aria-controls="module-mount">数据获取</button><button type="button" role="tab" data-module="payoffer" aria-controls="module-mount">收益结构</button><button type="button" role="tab" data-module="pricer" aria-controls="module-mount">估值定价</button><button type="button" role="tab" data-module="backtester" aria-controls="module-mount">历史回测</button><button type="button" role="tab" data-module="reporter" aria-controls="module-mount">研究报告</button></nav>
            <p class="sr-only" id="task-state" role="status">选择任务后，在同一研究上下文中运行模块。</p>
            <section class="work-stage" aria-live="polite"><section class="desk-panel is-active module-stage" id="module-mount" role="tabpanel"><div class="conversation-start"><div><h2>选择研究模块</h2><p class="conversation-start__copy">各研究模块独立执行，运行记录与研究报告统一归入当前任务。</p></div></div></section></section>
          </section>
        </div>
        <section class="assistant-region" aria-label="任务助手">
          <button class="assistant-toggle" type="button" data-assistant-toggle aria-controls="assistant-panel" aria-expanded="false" aria-label="打开任务对话"><span class="sr-only">打开任务对话</span></button>
          <section class="assistant-panel" id="assistant-panel" role="dialog" aria-modal="false" aria-label="任务对话" aria-hidden="true">
            <header class="assistant-panel__head"><div><strong>任务对话</strong><span>当前任务的连续对话</span></div><button class="assistant-panel__close" type="button" data-assistant-close aria-label="收起任务对话">×</button></header>
            <div class="assistant-panel__transcript" id="assistant-transcript"></div>
            <div class="desk-command-dock__body"><div class="composer composer--shared" data-attachment-drop-target><p class="notice" id="workspace-status" hidden role="status"></p><section class="composer-attachment-area" id="composer-attachments" aria-label="已添加附件" hidden><div class="composer-attachment-area__head"><strong>附件</strong><span data-attachment-count>0</span></div><div class="composer-attachment-list" data-attachment-list></div></section><form id="workspace-form"><textarea name="content" rows="1" placeholder="输入你的问题…" aria-label="任务要求"></textarea><div class="composer-actions"><div class="composer-actions__leading"><button class="composer-attach-control" type="button" data-attachment-trigger aria-controls="workspace-attachment-picker" aria-label="添加附件" title="添加图片、PDF、Word、Excel、PPT、Markdown或RTF等文档"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button><input class="composer-attachment-input" id="workspace-attachment-picker" data-attachment-input type="file" multiple tabindex="-1" aria-hidden="true" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.docx,.xlsx,.csv,.txt,.md,.markdown,.rtf,.pptx,.xls,.tsv,.html,.htm,.json,.jsonl,.xml,.yaml,.yml,.log,.odt,.ods,.odp"></div><div class="composer-actions__trailing"><label class="model-picker" for="workspace-model-picker"><span class="model-picker__label">当前模型</span><select id="workspace-model-picker" data-choice aria-label="选择模型"><option>未配置模型</option></select></label><button class="send-control" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="send-arrow" d="M12 19V5M6 11l6-6 6 6"></path><path class="send-success" d="m7.5 12.5 3 3 6-7"></path><rect class="stop-square" x="5" y="5" width="14" height="14" rx="1.5"></rect></svg></button></div></div></form></div></div>
          </section>
        </section>
      </main>
      <div class="workspace-splitter workspace-splitter--context" data-workspace-splitter="context" role="separator" aria-label="调整报告栏宽度" aria-orientation="vertical" tabindex="-1" aria-hidden="true"></div>
      <div class="workspace-sheet-scrim" data-report-scrim hidden aria-hidden="true"></div>
      <aside class="task-context" id="task-context" aria-label="任务与交付" aria-hidden="true" inert hidden><header class="task-context__head"><div><p class="context-kicker" data-report-panel-kicker>当前任务</p><h2 data-report-panel-title>任务与交付</h2></div><button class="drawer-close" type="button" data-report-close aria-label="收起任务与交付">×</button></header><section class="task-context__group" data-report-task-operations><p class="context-kicker">后台运行</p><div class="operation-list" id="operation-list" aria-live="polite"></div></section><section class="task-context__group"><p class="context-kicker" data-report-library-kicker>报告</p><div class="report-list" id="report-list"></div></section><p class="report-feedback" id="report-feedback" hidden role="status"></p><section class="task-context__group task-context__group--bottom"><p class="context-copy" data-report-panel-copy>运行状态与交付物均绑定当前任务。结果状态未知时不会自动重算。</p></section></aside>
      <div class="workspace-sheet-scrim" data-task-history-scrim hidden aria-hidden="true"></div>
      <aside class="mobile-task-drawer" id="mobile-task-drawer" aria-label="任务历史" aria-hidden="true" inert hidden><header class="task-context__head"><div><p class="context-kicker">当前工作区</p><h2>任务历史</h2></div><button class="drawer-close" type="button" data-task-history-close aria-label="收起任务历史">×</button></header><div class="task-list mobile-task-list" id="mobile-task-list" data-task-list data-mobile-task-list></div></aside>
    </div>
    <dialog class="attachment-lightbox" id="attachment-lightbox" aria-labelledby="attachment-lightbox-title"><div class="attachment-lightbox__frame"><div class="attachment-lightbox__head"><strong id="attachment-lightbox-title">图片预览</strong><button class="attachment-lightbox__close" type="button" data-attachment-lightbox-close aria-label="关闭图片预览">×</button></div><img data-attachment-lightbox-image src="/capability/assets/icons/optionhelper-app-icon-tile-light.svg" alt=""><p data-attachment-lightbox-name></p></div></dialog>
    <script type="module" src="/app/frontend/optchat/optchat.js"></script>
  </body>
</html>
