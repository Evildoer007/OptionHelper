[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-helper-app-source"
version = "0.1.0a1"
description = "OptionHelper App development source; no distributable is produced at this stage."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
