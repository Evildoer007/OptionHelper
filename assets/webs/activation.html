<!doctype html>
<!-- Direction contract: a single quiet activation step, using the established red research ledger rather than a sales or login screen. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OptionHelper</title><link rel="stylesheet" href="./workspace.css"></head>
<body><main class="activation"><div class="brand activation__brand"><img src="../../logo/optionhelper-logo.svg" alt="OptionHelper"><span>OptionHelper</span></div><section class="activation-card"><h1>导入许可证</h1><p>选择发行方提供的OptionHelper.license文件。许可证只决定可用能力，不包含模型Key、聊天内容或Report。</p><form id="activation-form"><label class="file-control" for="license-file"><input id="license-file" type="file" accept=".license,application/json"><span class="file-name" id="file-name">尚未选择文件</span></label><button class="button-primary" type="submit">验证并继续</button><p class="activation-result" id="activation-result" role="status"></p></form></section></main><script type="module" src="./activation.js"></script></body></html>
