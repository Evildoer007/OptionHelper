<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <!--
    OptionHelper极简情景Payoff模板
    红色标题条只写与optionlist.md一致的产品中文主键。
    每个情景卡片只保留情景短标题、关键价格标签和大幅Payoff图；完整条款、条件和公式以optionlib.md为准。
    文件命名：{分类编号}_{产品名称}_payoff.svg，例如：8.5_经典型雪球_payoff.svg。
  -->
  <title id="title">{{产品中文唯一名称}}情景Payoff图</title>
  <desc id="desc">产品的核心结算情景及其净收益图。横轴为到期价格或观察路径，纵轴为净收益。</desc>
  <defs>
    <linearGradient id="everbright-red-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C8102E"/><stop offset="100%" stop-color="#D89B27"/></linearGradient>
    <style>
      .cn { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #FFFFFF; }
      .scenario-no { font-size: 15px; font-weight: 700; fill: #C8102E; }
      .scenario-name { font-size: 17px; font-weight: 700; fill: #222222; }
      .small { font-size: 11px; fill: #777777; }
      .axis-title { font-size: 12px; font-weight: 600; fill: #252525; }
      .tick-label { font-size: 12px; fill: #4F4F4F; }
      .key-label { font-size: 12px; fill: #B16D00; }
      .axis { stroke: #252525; stroke-width: 1.9; }
      .zero { stroke: #777777; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .threshold { stroke: #D89B27; stroke-width: 2.4; stroke-dasharray: 8 5; }
      .payoff-line { fill: none; stroke: #C8102E; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; }
      .marker { fill: #C8102E; }
      .border { fill: #FFFFFF; stroke: #CFCFCF; stroke-width: 1.1; }
      .header-border { stroke: #C8102E; stroke-width: 4.5; }
      .footer-line { stroke: #C8102E; stroke-width: 2.4; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#FFFFFF"/>

  <!-- 标题条：仅展示OptionList中文主键。 -->
  <rect x="16" y="16" width="1468" height="64" fill="url(#everbright-red-gold)"/>
  <rect x="16" y="16" width="9" height="64" fill="#A80F28"/>
  <text class="cn title" x="40" y="56">{{产品中文唯一名称}}</text>

  <!-- 情景1：复制或删除整张卡片以匹配正文中的实际结算情景；始终两列排列。 -->
  <g class="cn">
    <rect class="border" x="16" y="92" width="728" height="360"/><line class="header-border" x1="16" y1="94" x2="744" y2="94"/>
    <text class="scenario-no" x="40" y="124">情景1</text><text class="scenario-name" x="100" y="124">{{短标题，例如：提前敲出}}</text>
  </g>
  <g transform="translate(42 145)">
    <line class="axis" x1="0" y1="275" x2="670" y2="275"/><line class="axis" x1="0" y1="4" x2="0" y2="275"/>
    <line class="zero" x1="0" y1="170" x2="670" y2="170"/><line class="threshold" x1="398" y1="6" x2="398" y2="275"/>
    <path class="payoff-line" d="M14 230 L398 230 L398 70 L650 70"/><circle class="marker" cx="398" cy="70" r="5"/>
    <text class="cn axis-title" x="0" y="-3">净收益</text><text class="cn tick-label" x="-10" y="174" text-anchor="end">0</text><text class="cn key-label" x="398" y="296" text-anchor="middle">{{关键价格}}</text><text class="cn axis-title" x="670" y="296" text-anchor="end">{{横轴名称}}</text>
  </g>

  <!-- 情景2 -->
  <g class="cn">
    <rect class="border" x="756" y="92" width="728" height="360"/><line class="header-border" x1="756" y1="94" x2="1484" y2="94"/>
    <text class="scenario-no" x="780" y="124">情景2</text><text class="scenario-name" x="840" y="124">{{短标题，例如：未敲入到期}}</text>
  </g>
  <g transform="translate(782 145)">
    <line class="axis" x1="0" y1="275" x2="670" y2="275"/><line class="axis" x1="0" y1="4" x2="0" y2="275"/>
    <line class="zero" x1="0" y1="170" x2="670" y2="170"/><line class="threshold" x1="365" y1="6" x2="365" y2="275"/>
    <path class="payoff-line" d="M14 228 L365 228 L365 78 L650 78"/><circle class="marker" cx="365" cy="78" r="5"/>
    <text class="cn axis-title" x="0" y="-3">净收益</text><text class="cn tick-label" x="-10" y="174" text-anchor="end">0</text><text class="cn key-label" x="365" y="296" text-anchor="middle">{{关键价格}}</text><text class="cn axis-title" x="670" y="296" text-anchor="end">{{横轴名称}}</text>
  </g>

  <!-- 情景3 -->
  <g class="cn">
    <rect class="border" x="16" y="464" width="728" height="360"/><line class="header-border" x1="16" y1="466" x2="744" y2="466"/>
    <text class="scenario-no" x="40" y="496">情景3</text><text class="scenario-name" x="100" y="496">{{短标题，例如：敲入后回升}}</text>
  </g>
  <g transform="translate(42 517)">
    <line class="axis" x1="0" y1="275" x2="670" y2="275"/><line class="axis" x1="0" y1="4" x2="0" y2="275"/>
    <line class="zero" x1="0" y1="170" x2="670" y2="170"/><line class="threshold" x1="382" y1="6" x2="382" y2="275"/>
    <path class="payoff-line" d="M14 240 L382 240 L382 170 L650 170"/><circle class="marker" cx="382" cy="170" r="5"/>
    <text class="cn axis-title" x="0" y="-3">净收益</text><text class="cn tick-label" x="-10" y="174" text-anchor="end">0</text><text class="cn key-label" x="382" y="296" text-anchor="middle">{{关键价格}}</text><text class="cn axis-title" x="670" y="296" text-anchor="end">{{横轴名称}}</text>
  </g>

  <!-- 情景4 -->
  <g class="cn">
    <rect class="border" x="756" y="464" width="728" height="360"/><line class="header-border" x1="756" y1="466" x2="1484" y2="466"/>
    <text class="scenario-no" x="780" y="496">情景4</text><text class="scenario-name" x="840" y="496">{{短标题，例如：敲入后下跌}}</text>
  </g>
  <g transform="translate(782 517)">
    <line class="axis" x1="0" y1="275" x2="670" y2="275"/><line class="axis" x1="0" y1="4" x2="0" y2="275"/>
    <line class="zero" x1="0" y1="170" x2="670" y2="170"/><line class="threshold" x1="382" y1="6" x2="382" y2="275"/>
    <path class="payoff-line" d="M14 58 L382 170 L650 252"/><circle class="marker" cx="382" cy="170" r="5"/>
    <text class="cn axis-title" x="0" y="-3">净收益</text><text class="cn tick-label" x="-10" y="174" text-anchor="end">0</text><text class="cn key-label" x="382" y="296" text-anchor="middle">{{关键价格}}</text><text class="cn axis-title" x="670" y="296" text-anchor="end">{{横轴名称}}</text>
  </g>

  <!-- 内嵌统一图例 -->
  <line class="footer-line" x1="16" y1="850" x2="1484" y2="850"/>
  <g class="cn">
    <line class="payoff-line" x1="16" y1="880" x2="58" y2="880"/><text class="small" x="71" y="885">Payoff</text>
    <line class="threshold" x1="170" y1="880" x2="212" y2="880"/><text class="small" x="225" y="885">关键价格/障碍</text>
    <line class="zero" x1="364" y1="880" x2="406" y2="880"/><text class="small" x="419" y="885">零收益</text>
    <line class="axis" x1="520" y1="880" x2="562" y2="880"/><text class="small" x="575" y="885">坐标轴</text>
  </g>
</svg>
