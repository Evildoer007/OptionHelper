<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OptionHelper tile application icon</title>
  <desc id="desc">A light rounded-square application tile containing the OptionHelper red Call payoff mark.</desc>
  <defs>
    <linearGradient id="tile" x1="112" y1="112" x2="912" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFDFB"/>
      <stop offset="1" stop-color="#F1F2EF"/>
    </linearGradient>
    <radialGradient id="tileSheen" cx="50%" cy="43%" r="86%">
      <stop stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#24272D" flood-opacity=".10"/>
    </filter>
    <linearGradient id="red" x1="292.0625" y1="826.8125" x2="822.5" y2="279.125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A90022"/>
      <stop offset="1" stop-color="#C8102E"/>
    </linearGradient>
  </defs>
  <rect x="112" y="112" width="800" height="800" rx="176" fill="url(#tile)" filter="url(#tileShadow)" stroke="#D2D4CF" stroke-opacity=".38" stroke-width="2.5"/>
  <rect x="112" y="112" width="800" height="800" rx="176" fill="url(#tileSheen)"/>
  <rect x="116" y="116" width="792" height="792" rx="172" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="1.5"/>
  <g transform="translate(208.4 208.4) scale(2.371875)">
    <circle cx="128" cy="128" r="128" fill="url(#red)"/>
    <path d="M65 173H111C126 173 138 169 149 160L204 111" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="19"/>
    <circle cx="65" cy="173" r="9.5" fill="#fff"/>
    <circle cx="204" cy="111" r="9.5" fill="#fff"/>
    <path d="M181 65A82 82 0 1 0 181 191" fill="none" opacity=".28" stroke="#fff" stroke-linecap="round" stroke-width="8"/>
  </g>
</svg>
